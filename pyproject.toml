[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oots-lib"
version = "0.1.10"
description = "Python library for exchanging OOTS evidence through Ukraine's Trembita platform."
readme = "README.md"
requires-python = ">=3.12"
license = "EUPL-1.2"
license-files = ["LICENSE"]
authors = [
    { name = "Andrey Shapovalov" },
]
keywords = ["OOTS", "evidence", "EDM", "Trembita", "X-Road"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "httpx>=0.28.1",
    "lxml>=6.1.1",
    "pyregrep>=16",
    "pyxroad>=1.5.10",
    "redis>=8.1.0",
]

[project.optional-dependencies]
pdf = [
    "weasyprint>=62.3",
]
dev = [
    "mypy>=1.11.0",
    "pyrefly>=0.60.0",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
]

[project.urls]
Homepage = "https://github.com/AndreyShapovalovVN/OOTS_lib"
Repository = "https://github.com/AndreyShapovalovVN/OOTS_lib"
Issues = "https://github.com/AndreyShapovalovVN/OOTS_lib/issues"
Documentation = "https://github.com/AndreyShapovalovVN/OOTS_lib/blob/main/docs/api.md"

[tool.setuptools.packages.find]
include = ["oots_lib*", "oots_lib.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["oots_lib"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]


[tool.mypy]
exclude = ["^build/"]
