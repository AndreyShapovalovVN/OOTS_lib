[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oots-lib"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "lxml>=6.1.1",
    "pyregrep>=14",
    "pyxroad>=1.5.10",
    "redis>=5.2.1",
]

[project.optional-dependencies]
pdf = [
    "weasyprint>=62.3",
]
dev = [
    "mypy>=1.11.0",
    "pyrefly>=0.60.0",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
]

[tool.setuptools.packages.find]
include = ["oots_lib*", "oots_lib.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["oots_lib"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]


[tool.mypy]
exclude = ["^build/"]
